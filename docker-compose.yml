services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opsrelay
      POSTGRES_USER: opsrelay
      POSTGRES_PASSWORD: opsrelay_dev_password
    ports:
      - "5432:5432"
    volumes:
      - opsrelay-postgres:/var/lib/postgresql/data

volumes:
  opsrelay-postgres:
